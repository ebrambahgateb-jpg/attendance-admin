<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Attendance Admin</title>

<style>

body {
    font-family: Arial;
    text-align: center;
    background: #f5f5f5;
    padding: 30px;
}

h1 {
    margin-bottom: 30px;
}

button {
    background: #222;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 15px 30px;
    font-size: 20px;
}

video {
    width: 100%;
    max-width: 500px;
    margin-top: 30px;
    border-radius: 15px;
}

#status {
    margin-top: 20px;
    font-size: 20px;
}

</style>

</head>

<body>

<h1>📷 Attendance Admin</h1>

<button onclick="startCamera()">
تشغيل الكاميرا
</button>

<br>

<video
id="camera"
autoplay
playsinline>
</video>

<div id="status">
اضغط على تشغيل الكاميرا
</div>


<script>

async function startCamera() {

    const status =
        document.getElementById("status");

    const video =
        document.getElementById("camera");

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                audio: false

            });

        video.srcObject = stream;

        status.innerHTML =
            "✅ الكاميرا تعمل بنجاح";

    }

    catch(error) {

        status.innerHTML =
            "❌ " +
            error.name +
            "<br>" +
            error.message;

        console.error(error);

    }

}

</script>

</body>

</html>
