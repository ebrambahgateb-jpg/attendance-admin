<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0">

<title>نظام تسجيل الحضور</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f3f4f6;

    color: #222;

}

.container {

    width: 100%;

    max-width: 600px;

    margin: auto;

    padding: 15px;

}

    text-align: center;

    margin: 10px 0 20px;

}

.card {

    background: white;

    border-radius: 18px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);

}

    display: block;

    font-size: 18px;

    width: 100%;

    padding: 15px;

}

}

.stat-number {

}

    font-size: 15px;

}

</style>

</head>


<body>


<div class="container">


<h1>
📋 تسجيل الحضور
</h1>


<!-- =========================
     اختيار الاجتماع
========================= -->

<div class="card">

<label>
اختر الاجتماع
</label>

<select id="meeting">

<option value="">
⏳ جاري تحميل الاجتماعات...
</option>

</select>

</div>


<!-- =========================
     الإحصائيات
========================= -->

<div class="card">

<div class="stats">

<div class="stat">

<div
class="stat-number"
id="presentCount">

0

</div>

<div class="stat-label">

الحاضرون

</div>

</div>


<div class="stat">

<div
class="stat-number"
id="totalCount">

0

</div>

<div class="stat-label">

إجمالي الأشخاص

</div>

</div>

</div>

</div>

     Scanner
========================= -->

<div class="card">

<div id="reader"></div>


<button
id="startButton"

📷 تشغيل الكاميرا

</button>


<button
id="stopButton"
onclick="stopScanner()"
disabled>

⛔ إيقاف الكاميرا

</button>

<!-- =========================
     النتيجة
========================= -->

<div class="card">

<div id="result">

اختر الاجتماع ثم شغّل الكاميرا

</div>

</div>


<!-- =========================
     آخر شخص
========================= -->

<div class="card">

<div class="last-person">

<b>آخر تسجيل</b>

<div id="lastPerson">

لا يوجد تسجيل حتى الآن

</div>

</div>

</div>


</div>


<script>


// ==================================================
// رابط Apps Script
// ==================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbzecOlCAeuzfo5bVadfRxViGbC2j7g8vsNRksvC2jIB6jl0OAkR4ImQqBhtuaK4DneM/exec";


// ==================================================
// Variables
// ==================================================

let scanner = null;

let scanning = false;

let selectedMeeting = "";

let processing = false;

let attendanceData = [];

let peopleData = [];


// ==================================================
// JSONP API
// ==================================================

function apiGet(params) {

    return new Promise(
        function(resolve, reject) {

            const callbackName =
                "callback_" +
                Date.now() +
                "_" +
                Math.floor(
                    Math.random() * 10000
                );


            const script =
                document.createElement("script");


            const query =
                new URLSearchParams(
                    params
                );


            query.append(
                "callback",
                callbackName
            );


            window[callbackName] =
                function(data) {

                    resolve(data);

                    delete window[
                        callbackName
                    ];

                    script.remove();

                };


            script.src =
                API_URL +
                "?" +
                query.toString();


            script.onerror =
                function() {

                    reject(
                        new Error(
                            "API Error"
                        )
                    );

                    delete window[
                        callbackName
                    ];

                    script.remove();

                };


            document.body.appendChild(
                script
            );

        }
    );

}


// ==================================================
// تحميل الأشخاص
// ==================================================

async function loadPeople() {

    try {

        const data =
            await apiGet({
                action: "people"
            });


        if (
            !data.success
        ) {

            throw new Error(
                "People error"
            );

        }


        peopleData =
            data.people || [];


        document
        .getElementById(
            "totalCount"
        )
        .textContent =
            peopleData.filter(
                function(person) {

                    return (
                        person.status ===
                        "active"
                    );

                }
            ).length;


    }

    catch(error) {

        console.error(
            "People:",
            error
        );

    }

}


// ==================================================
// تحميل الحضور
// ==================================================

async function loadAttendance() {

    try {

        const data =
            await apiGet({
                action:
                    "attendanceList"
            });


        if (
            !data.success
        ) {

            return;

        }


        attendanceData =
            data.attendance || [];


        updateCounter();

    }

    catch(error) {

        console.error(
            "Attendance:",
            error
        );

    }

}


// ==================================================
// تحديث عداد الحضور
// ==================================================

function updateCounter() {

    if (!selectedMeeting) {

        document
        .getElementById(
            "presentCount"
        )
        .textContent = "0";

        return;

    }


    const count =
        attendanceData.filter(
            function(item) {

                return (
                    item.meeting ===
                    getSelectedMeetingName()
                );

            }
        ).length;


    document
    .getElementById(
        "presentCount"
    )
    .textContent =
        count;

}


// ==================================================
// الحصول على اسم الاجتماع
// ==================================================

function getSelectedMeetingName() {

    const select =
        document.getElementById(
            "meeting"
        );


    const option =
        select.options[
            select.selectedIndex
        ];


    if (!option) {

        return "";

    }


    return option.textContent;

}


// ==================================================
// تحميل الاجتماعات
// ==================================================

async function loadMeetings() {

    const select =
        document.getElementById(
            "meeting"
        );


    try {

        const data =
            await apiGet({
                action: "meetings"
            });


        if (!data.success) {

            throw new Error(
                "Meetings error"
            );

        }


        select.innerHTML =
            '<option value="">اختر الاجتماع</option>';


        data.meetings.forEach(
            function(meeting) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    meeting.id;


                option.textContent =
                    meeting.name;


                select.appendChild(
                    option
                );

            }
        );


    }

    catch(error) {

        select.innerHTML =
            '<option value="">❌ فشل تحميل الاجتماعات</option>';


        showResult(
            "❌ لا يمكن الاتصال بقاعدة البيانات",
            "error"
        );


        console.error(error);

    }

}


// ==================================================
// اختيار الاجتماع
// ==================================================

document
.getElementById("meeting")
.addEventListener(
    "change",
    async function() {

        selectedMeeting =
            this.value;


        if (
            selectedMeeting
        ) {

            await loadAttendance();

            showResult(
                "📷 اضغط تشغيل الكاميرا لبدء تسجيل الحضور",
                "loading"
            );

        }

        else {

            document
            .getElementById(
                "presentCount"
            )
            .textContent =
                "0";


            showResult(
                "اختر الاجتماع ثم شغّل الكاميرا",
                "loading"
            );

        }

    }
);


// ==================================================
// تشغيل الكاميرا
// ==================================================

async function startScanner() {

    if (!selectedMeeting) {

        showResult(
            "⚠️ اختر الاجتماع أولاً",
            "warning"
        );

        return;

    }


    if (scanning) {

        return;

    }


    processing = false;


    scanner =
        new Html5Qrcode(
            "reader"
        );


    try {

        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps: 10,

                qrbox: {

                    width: 250,

                    height: 250

                }

            },

            function(decodedText) {

                handleQRCode(
                    decodedText
                );

            }

        );


        scanning = true;


        document
        .getElementById(
            "startButton"
        )
        .disabled = true;


        document
        .getElementById(
            "stopButton"
        )
        .disabled = false;


        showResult(
            "📷 وجّه الكاميرا إلى QR Code",
            "loading"
        );

    }

    catch(error) {

        showResult(

            "❌ لم يتم تشغيل الكاميرا" +
            "<br><br>" +
            error,

            "error"

        );


        console.error(error);

    }

}


// ==================================================
// QR تم قراءته
// ==================================================

async function handleQRCode(
    qr
) {

    if (processing) {

        return;

    }


    processing = true;


    showResult(
        "⏳ جاري تسجيل الحضور...",
        "loading"
    );


    try {

        const data =
            await apiGet({

                action:
                    "attendance",

                qr:
                    qr,

                meeting:
                    selectedMeeting

            });


        // ==========================
        // نجاح
        // ==========================

        if (data.success) {

            showResult(

                "✅ <b>تم تسجيل الحضور</b>" +

                "<br><br>" +

                "👤 " +
                escapeHTML(
                    data.name
                ) +

                "<br>" +

                "🆔 ID: " +
                escapeHTML(
                    data.id
                ) +

                "<br>" +

                "📅 " +
                data.date +

                "<br>" +

                "⏰ " +
                data.time,

                "success"

            );


            // تحديث آخر شخص

            document
            .getElementById(
                "lastPerson"
            )
            .innerHTML =

                "👤 <b>" +
                escapeHTML(
                    data.name
                ) +
                "</b>" +

                "<br>" +

                "⏰ " +
                data.time;


            // إضافة التسجيل محليًا

            attendanceData.push({

                id:
                    data.id,

                name:
                    data.name,

                meeting:
                    data.meeting,

                date:
                    data.date,

                time:
                    data.time

            });


            updateCounter();


            // صوت نجاح

            playBeep(
                800,
                180
            );

        }


        // ==========================
        // مكرر
        // ==========================

        else if (
            data.duplicate
        ) {

            showResult(

                "⚠️ <b>مسجل بالفعل</b>" +

                "<br><br>" +

                "👤 " +
                escapeHTML(
                    data.name
                ) +

                "<br>" +

                "⏰ وقت التسجيل: " +
                data.oldTime,

                "warning"

            );


            playBeep(
                400,
                250
            );

        }


        // ==========================
        // شخص غير مفعل
        // ==========================

        else if (
            data.inactive
        ) {

            showResult(

                "🚫 <b>الشخص غير مفعل</b>" +

                "<br><br>" +

                data.message,

                "error"

            );


            playBeep(
                250,
                400
            );

        }


        // ==========================
        // خطأ
        // ==========================

        else {

            showResult(

                "❌ " +
                escapeHTML(
                    data.message
                ),

                "error"

            );


            playBeep(
                250,
                400
            );

        }

    }

    catch(error) {

        showResult(

            "❌ حدث خطأ أثناء الاتصال بقاعدة البيانات",

            "error"

        );


        console.error(error);


        playBeep(
            250,
            400
        );

    }


    // السماح بالـScan التالي

    setTimeout(

        function() {

            processing = false;

            if (scanning) {

                showResult(
                    "📷 جاهز لمسح QR التالي",
                    "loading"
                );

            }

        },

        2000

    );

}


// ==================================================
// صوت التنبيه
// ==================================================

function playBeep(
    frequency,
    duration
) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audioContext =
            new AudioContext();


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.frequency.value =
            frequency;


        oscillator.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        gain.gain.value =
            0.15;


        oscillator.start();


        setTimeout(
            function() {

                oscillator.stop();

                audioContext.close();

            },
            duration
        );

    }

    catch(error) {

        console.log(
            "Audio error",
            error
        );

    }

}


// ==================================================
// إيقاف Scanner
// ==================================================

async function stopScanner() {

    if (
        scanner &&
        scanning
    ) {

        try {

            await scanner.stop();

            await scanner.clear();

        }

        catch(error) {

            console.error(
                error
            );

        }

    }


    scanning = false;

    processing = false;


    document
    .getElementById(
        "startButton"
    )
    .disabled = false;


    document
    .getElementById(
        "stopButton"
    )
    .disabled = true;


    showResult(
        "📷 تم إيقاف الكاميرا",
        "loading"
    );

}


// ==================================================
// عرض النتيجة
// ==================================================

function showResult(
    message,
    type
) {

    const result =
        document.getElementById(
            "result"
        );


    result.innerHTML =
        "<div class='" +
        type +
        "'>" +
        message +
        "</div>";

}


// ==================================================
// حماية HTML
// ==================================================

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text == null
            ? ""
            : String(text);


    return div.innerHTML;

}


// ==================================================
// بدء التشغيل
// ==================================================

async function init() {

    await loadPeople();

    await loadMeetings();

    await loadAttendance();

}


// تشغيل

init();


</script>


</body>

</html>
```
