<script>


// ==================================================
// CONFIGURATION
// ==================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxN6kZVZYQD-gS0n8ovnQQZh7IW9KpFKiI2mrx6uYpVww0wFyJ-Wfw_NnX4YDedLg/exec";


const GOOGLE_CLIENT_ID =
"869477346331-hbdiou239jbo6ldu8q47u6jel6gb7019.apps.googleusercontent.com";


// ==================================================
// Variables
// ==================================================

let scanner = null;

let scanning = false;

let selectedMeeting = "";

let processing = false;

let attendanceData = [];

let peopleData = [];

let idToken = "";

let currentAccount = null;

let selectedRole = "";


// ==================================================
// Google Login
// ==================================================

function initializeGoogleLogin() {

    if (
        !window.google ||
        !google.accounts ||
        !google.accounts.id
    ) {

        setTimeout(
            initializeGoogleLogin,
            500
        );

        return;

    }


    google.accounts.id.initialize({

        client_id:
            GOOGLE_CLIENT_ID,

        callback:
            handleGoogleLogin,

        auto_select:
            false,

        cancel_on_tap_outside:
            true

    });


    google.accounts.id.renderButton(

        document.getElementById(
            "googleLogin"
        ),

        {

            theme: "outline",

            size: "large",

            text: "signin_with",

            shape: "rectangular",

            width: 300

        }

    );

}


// ==================================================
// Google Login Callback
// ==================================================

async function handleGoogleLogin(
    response
) {

    const message =
        document.getElementById(
            "loginMessage"
        );


    message.innerHTML =
        "<span class='loading'>⏳ جاري التحقق من الحساب...</span>";


    try {

        if (
            !response ||
            !response.credential
        ) {

            throw new Error(
                "لم يتم الحصول على بيانات Google"
            );

        }


        idToken =
            response.credential;


        const result =
            await apiPost({

                action:
                    "authenticate",

                idToken:
                    idToken

            });


        if (!result.ok) {

            throw new Error(
                result.message ||
                "فشل تسجيل الدخول"
            );

        }


        if (
            !result.authorized
        ) {

            throw new Error(
                "هذا الحساب غير مصرح له باستخدام النظام."
            );

        }


        currentAccount =
            result;


        document
        .getElementById(
            "userEmail"
        )
        .textContent =
            "👤 " +
            result.email;


        const roles =
            result.roles || [];


        if (
            roles.length === 0
        ) {

            throw new Error(
                "الحساب ليس لديه أي صلاحية."
            );

        }


        // لو عنده صلاحية واحدة فقط
        if (
            roles.length === 1
        ) {

            selectRole(
                roles[0]
            );

            return;

        }


        // أكثر من صلاحية
        showRoleSelection(
            roles
        );

    }

    catch(error) {

        console.error(
            "Login error:",
            error
        );


        idToken = "";

        currentAccount = null;


        message.innerHTML =
            "<div class='error'>" +
            "❌ " +
            escapeHTML(
                error.message
            ) +
            "</div>";

    }

}


// ==================================================
// Role Selection
// ==================================================

function showRoleSelection(
    roles
) {

    document
    .getElementById(
        "loginScreen"
    )
    .classList.add(
        "hidden"
    );


    document
    .getElementById(
        "roleScreen"
    )
    .classList.remove(
        "hidden"
    );


    const container =
        document.getElementById(
            "roleButtons"
        );


    container.innerHTML = "";


    roles.forEach(
        function(role) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "role-button";


            button.textContent =
                getRoleName(
                    role
                );


            button.onclick =
                function() {

                    selectRole(
                        role
                    );

                };


            container.appendChild(
                button
            );

        }
    );

}


// ==================================================
// Role Name
// ==================================================

function getRoleName(
    role
) {

    const names = {

        Owner:
            "👑 Owner",

        Admin:
            "⚙️ المدير",

        Scanner:
            "📷 تسجيل الحضور",

        User:
            "👤 المستخدم"

    };


    return (
        names[role] ||
        role
    );

}


// ==================================================
// Select Role
// ==================================================

function selectRole(
    role
) {

    selectedRole =
        role;


    // ==================================================
    // OWNER
    // يفتح لوحة الإدارة
    // ==================================================

  if (
    role === "Owner" ||
    role === "Admin"
) {

    // حفظ جلسة Google مؤقتًا حتى تصل إلى admin.html
    sessionStorage.setItem(
        "attendance_idToken",
        idToken
    );

    sessionStorage.setItem(
        "attendance_account",
        JSON.stringify(currentAccount)
    );

    sessionStorage.setItem(
        "attendance_selectedRole",
        role
    );

    window.location.href =
        "admin.html";

    return;

}

    // ==================================================
    // ADMIN
    // يفتح لوحة الإدارة
    // ==================================================

    if (
        role === "Admin"
    ) {

        window.location.href =
            "admin.html";

        return;

    }


    // ==================================================
    // SCANNER
    // يدخل نظام تسجيل الحضور
    // ==================================================

    if (
        role === "Scanner"
    ) {

        document
        .getElementById(
            "roleScreen"
        )
        .classList.add(
            "hidden"
        );


        document
        .getElementById(
            "loginScreen"
        )
        .classList.add(
            "hidden"
        );


        document
        .getElementById(
            "app"
        )
        .classList.remove(
            "hidden"
        );


        showResult(
            "⏳ جاري تحميل نظام تسجيل الحضور...",
            "loading"
        );


        init();

        return;

    }


    // ==================================================
    // USER
    // يدخل كمستخدم فقط
    // ==================================================

    if (
        role === "User"
    ) {

        document
        .getElementById(
            "roleScreen"
        )
        .classList.add(
            "hidden"
        );


        document
        .getElementById(
            "loginScreen"
        )
        .classList.add(
            "hidden"
        );


        document
        .getElementById(
            "app"
        )
        .classList.remove(
            "hidden"
        );


        showResult(

            "👤 <b>تم تسجيل الدخول كمستخدم</b>" +

            "<br><br>" +

            "هذه الصفحة مخصصة لعرض بيانات المستخدم فقط." +

            "<br><br>" +

            "سيتم إضافة صفحة المستخدم لاحقًا.",

            "loading"

        );


        // إخفاء اختيار الاجتماع
        document
        .getElementById(
            "meeting"
        )
        .closest(".card")
        .classList.add(
            "hidden"
        );


        // إخفاء الإحصائيات
        document
        .getElementById(
            "presentCount"
        )
        .closest(".card")
        .classList.add(
            "hidden"
        );


        // إخفاء الكاميرا
        document
        .getElementById(
            "reader"
        )
        .closest(".card")
        .classList.add(
            "hidden"
        );


        // إخفاء آخر تسجيل
        document
        .getElementById(
            "lastPerson"
        )
        .closest(".card")
        .classList.add(
            "hidden"
        );


        return;

    }


    // ==================================================
    // ROLE UNKNOWN
    // ==================================================

    alert(
        "هذه الصلاحية غير معروفة."
    );

}


// ==================================================
// Logout
// ==================================================

function logout() {

    stopScanner();


    idToken = "";

    currentAccount = null;

    selectedRole = "";

    attendanceData = [];

    peopleData = [];

    selectedMeeting = "";


    // إظهار العناصر مرة أخرى في حالة تسجيل دخول جديد
    const meetingCard =
        document
        .getElementById("meeting")
        .closest(".card");

    if (meetingCard) {
        meetingCard.classList.remove("hidden");
    }


    const statsCard =
        document
        .getElementById("presentCount")
        .closest(".card");

    if (statsCard) {
        statsCard.classList.remove("hidden");
    }


    const scannerCard =
        document
        .getElementById("reader")
        .closest(".card");

    if (scannerCard) {
        scannerCard.classList.remove("hidden");
    }


    const lastCard =
        document
        .getElementById("lastPerson")
        .closest(".card");

    if (lastCard) {
        lastCard.classList.remove("hidden");
    }


    document
    .getElementById(
        "app"
    )
    .classList.add(
        "hidden"
    );


    document
    .getElementById(
        "roleScreen"
    )
    .classList.add(
        "hidden"
    );


    document
    .getElementById(
        "loginScreen"
    )
    .classList.remove(
        "hidden"
    );


    document
    .getElementById(
        "loginMessage"
    )
    .innerHTML = "";


    initializeGoogleLogin();

}


// ==================================================
// POST API
// ==================================================

async function apiPost(
    params
) {

    const response =
        await fetch(
            API_URL,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(
                        params
                    )

            }
        );


    if (!response.ok) {

        throw new Error(
            "API HTTP Error: " +
            response.status
        );

    }


    const text =
        await response.text();


    let data;


    try {

        data =
            JSON.parse(
                text
            );

    }

    catch(error) {

        console.error(
            "Invalid API response:",
            text
        );

        throw new Error(
            "استجابة غير صحيحة من الخادم"
        );

    }


    if (
        data &&
        data.error ===
        "AUTH_REQUIRED"
    ) {

        logout();

        throw new Error(
            "انتهت جلسة تسجيل الدخول"
        );

    }


    return data;

}


// ==================================================
// تحميل الأشخاص
// ==================================================

async function loadPeople() {

    try {

        const data =
            await apiPost({

                action:
                    "getPeople",

                idToken:
                    idToken

            });


        if (
            !data.ok &&
            !data.success
        ) {

            throw new Error(
                data.message ||
                "People error"
            );

        }


        peopleData =
            data.people || [];


        document
        .getElementById(
            "totalCount"
        )
        .textContent =
            peopleData.filter(
                function(person) {

                    return (
                        person.status ===
                        "active"
                    );

                }
            ).length;

    }

    catch(error) {

        console.error(
            "People:",
            error
        );

    }

}


// ==================================================
// تحميل الحضور
// ==================================================

async function loadAttendance() {

    try {

        const data =
            await apiPost({

                action:
                    "getAttendance",

                idToken:
                    idToken

            });


        if (
            !data.ok &&
            !data.success
        ) {

            return;

        }


        attendanceData =
            data.attendance || [];


        updateCounter();

    }

    catch(error) {

        console.error(
            "Attendance:",
            error
        );

    }

}


// ==================================================
// تحديث عداد الحضور
// ==================================================

function updateCounter() {

    if (!selectedMeeting) {

        document
        .getElementById(
            "presentCount"
        )
        .textContent =
            "0";

        return;

    }


    const meeting =
        getSelectedMeeting();


    if (!meeting) {

        return;

    }


    const count =
        attendanceData.filter(
            function(item) {

                return (
                    item.meetingId ===
                    selectedMeeting ||

                    item.MeetingID ===
                    selectedMeeting ||

                    item.meeting ===
                    meeting.name ||

                    item.MeetingName ===
                    meeting.name
                );

            }
        ).length;


    document
    .getElementById(
        "presentCount"
    )
    .textContent =
        count;

}


// ==================================================
// الحصول على الاجتماع المختار
// ==================================================

function getSelectedMeeting() {

    const select =
        document.getElementById(
            "meeting"
        );


    const option =
        select.options[
            select.selectedIndex
        ];


    if (!option) {

        return null;

    }


    return {

        id:
            option.value,

        name:
            option.textContent

    };

}


// ==================================================
// تحميل الاجتماعات
// ==================================================

async function loadMeetings() {

    const select =
        document.getElementById(
            "meeting"
        );


    try {

        const data =
            await apiPost({

                action:
                    "getMeetings",

                idToken:
                    idToken

            });


        if (
            !data.ok &&
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Meetings error"
            );

        }


        const meetings =
            data.meetings || [];


        select.innerHTML =
            '<option value="">اختر الاجتماع</option>';


        meetings.forEach(
            function(meeting) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    meeting.id ||
                    meeting.ID;


                option.textContent =
                    meeting.name ||
                    meeting.Name;


                select.appendChild(
                    option
                );

            }
        );


    }

    catch(error) {

        select.innerHTML =
            '<option value="">❌ فشل تحميل الاجتماعات</option>';


        showResult(
            "❌ لا يمكن تحميل الاجتماعات",
            "error"
        );


        console.error(
            "Meetings:",
            error
        );

    }

}


// ==================================================
// اختيار الاجتماع
// ==================================================

document
.getElementById("meeting")
.addEventListener(
    "change",
    async function() {

        selectedMeeting =
            this.value;


        if (
            selectedMeeting
        ) {

            await loadAttendance();


            showResult(
                "📷 اضغط تشغيل الكاميرا لبدء تسجيل الحضور",
                "loading"
            );

        }

        else {

            document
            .getElementById(
                "presentCount"
            )
            .textContent =
                "0";


            showResult(
                "اختر الاجتماع ثم شغّل الكاميرا",
                "loading"
            );

        }

    }
);


// ==================================================
// تشغيل الكاميرا
// ==================================================

async function startScanner() {

    if (!selectedMeeting) {

        showResult(
            "⚠️ اختر الاجتماع أولاً",
            "warning"
        );

        return;

    }


    if (!idToken) {

        showResult(
            "❌ يجب تسجيل الدخول أولاً",
            "error"
        );

        return;

    }


    if (scanning) {

        return;

    }


    processing = false;


    scanner =
        new Html5Qrcode(
            "reader"
        );


    try {

        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps: 10,

                qrbox: {

                    width: 250,

                    height: 250

                }

            },

            function(decodedText) {

                handleQRCode(
                    decodedText
                );

            }

        );


        scanning = true;


        document
        .getElementById(
            "startButton"
        )
        .disabled = true;


        document
        .getElementById(
            "stopButton"
        )
        .disabled = false;


        showResult(
            "📷 وجّه الكاميرا إلى QR Code",
            "loading"
        );

    }

    catch(error) {

        showResult(

            "❌ لم يتم تشغيل الكاميرا" +
            "<br><br>" +
            escapeHTML(error),

            "error"

        );


        console.error(
            error
        );

    }

}


// ==================================================
// QR تم قراءته
// ==================================================

async function handleQRCode(
    qr
) {

    if (processing) {

        return;

    }


    processing = true;


    showResult(
        "⏳ جاري تسجيل الحضور...",
        "loading"
    );


    try {

        const data =
            await apiPost({

                action:
                    "scanAttendance",

                idToken:
                    idToken,

                qr:
                    qr

            });


        // ==========================
        // نجاح
        // ==========================

        if (
            data.ok ||
            data.success
        ) {

            const personName =
                data.name ||
                data.personName ||
                "";


            const personId =
                data.id ||
                data.personId ||
                "";


            const meetingName =
                data.meeting ||
                data.meetingName ||
                "";


            const date =
                data.date ||
                data.meetingDate ||
                "";


            const time =
                data.time ||
                data.recordedTime ||
                "";


            showResult(

                "✅ <b>تم تسجيل الحضور</b>" +

                "<br><br>" +

                "👤 " +
                escapeHTML(
                    personName
                ) +

                "<br>" +

                "🆔 ID: " +
                escapeHTML(
                    personId
                ) +

                "<br>" +

                "📅 " +
                escapeHTML(
                    date
                ) +

                "<br>" +

                "⏰ " +
                escapeHTML(
                    time
                ),

                "success"

            );


            document
            .getElementById(
                "lastPerson"
            )
            .innerHTML =

                "👤 <b>" +
                escapeHTML(
                    personName
                ) +
                "</b>" +

                "<br>" +

                "⏰ " +
                escapeHTML(
                    time
                );


            attendanceData.push({

                id:
                    personId,

                name:
                    personName,

                meeting:
                    meetingName,

                date:
                    date,

                time:
                    time

            });


            updateCounter();


            playBeep(
                800,
                180
            );

        }


        // ==========================
        // مكرر
        // ==========================

        else if (
            data.duplicate
        ) {

            showResult(

                "⚠️ <b>مسجل بالفعل</b>" +

                "<br><br>" +

                "👤 " +

                escapeHTML(
                    data.name ||
                    data.personName ||
                    ""
                ) +

                "<br>" +

                "⏰ وقت التسجيل: " +

                escapeHTML(
                    data.oldTime ||
                    ""
                ),

                "warning"

            );


            playBeep(
                400,
                250
            );

        }


        // ==========================
        // شخص غير مفعل
        // ==========================

        else if (
            data.inactive
        ) {

            showResult(

                "🚫 <b>الشخص غير مفعل</b>" +

                "<br><br>" +

                escapeHTML(
                    data.message ||
                    ""
                ),

                "error"

            );


            playBeep(
                250,
                400
            );

        }


        // ==========================
        // خطأ
        // ==========================

        else {

            showResult(

                "❌ " +

                escapeHTML(
                    data.message ||
                    "حدث خطأ"
                ),

                "error"

            );


            playBeep(
                250,
                400
            );

        }

    }

    catch(error) {

        showResult(

            "❌ حدث خطأ أثناء الاتصال بقاعدة البيانات" +

            "<br><br>" +

            escapeHTML(
                error.message
            ),

            "error"

        );


        console.error(
            error
        );


        playBeep(
            250,
            400
        );

    }


    setTimeout(

        function() {

            processing = false;


            if (scanning) {

                showResult(
                    "📷 جاهز لمسح QR التالي",
                    "loading"
                );

            }

        },

        2000

    );

}


// ==================================================
// صوت التنبيه
// ==================================================

function playBeep(
    frequency,
    duration
) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        const audioContext =
            new AudioContext();


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.frequency.value =
            frequency;


        oscillator.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        gain.gain.value =
            0.15;


        oscillator.start();


        setTimeout(
            function() {

                oscillator.stop();

                audioContext.close();

            },
            duration
        );

    }

    catch(error) {

        console.log(
            "Audio error",
            error
        );

    }

}


// ==================================================
// إيقاف Scanner
// ==================================================

async function stopScanner() {

    if (
        scanner &&
        scanning
    ) {

        try {

            await scanner.stop();

            await scanner.clear();

        }

        catch(error) {

            console.error(
                error
            );

        }

    }


    scanning = false;

    processing = false;


    document
    .getElementById(
        "startButton"
    )
    .disabled = false;


    document
    .getElementById(
        "stopButton"
    )
    .disabled = true;


    showResult(
        "📷 تم إيقاف الكاميرا",
        "loading"
    );

}


// ==================================================
// عرض النتيجة
// ==================================================

function showResult(
    message,
    type
) {

    const result =
        document.getElementById(
            "result"
        );


    result.innerHTML =
        "<div class='" +
        type +
        "'>" +
        message +
        "</div>";

}


// ==================================================
// حماية HTML
// ==================================================

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text == null
            ? ""
            : String(text);


    return div.innerHTML;

}
