<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Attendance Admin</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
    font-family: Arial;
    text-align: center;
    background: #f5f5f5;
    padding: 20px;
}

h1 {
    margin-bottom: 20px;
}

button {
    background: #222;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 15px 30px;
    font-size: 20px;
    margin: 10px;
}

#reader {
    width: 100%;
    max-width: 500px;
    margin: 20px auto;
    background: white;
    border-radius: 15px;
    overflow: hidden;
}

#result {
    margin-top: 20px;
    padding: 20px;
    background: white;
    border-radius: 15px;
    font-size: 20px;
}

</style>

</head>


<body>

<h1>📷 تسجيل الحضور</h1>

<button onclick="startScanner()">
تشغيل QR Scanner
</button>

<div id="reader"></div>

<div id="result">
اضغط تشغيل QR Scanner
</div>


<script>

let scanner = null;

let scanning = false;


async function startScanner() {

    if (scanning) {
        return;
    }

    scanning = true;

    document.getElementById("result").innerHTML =
        "⏳ جاري تشغيل الكاميرا...";

    scanner = new Html5Qrcode("reader");


    try {

        await scanner.start(

            {
                facingMode: "environment"
            },

            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                }
            },

            function(decodedText) {

                console.log(
                    "QR:",
                    decodedText
                );


                document.getElementById("result").innerHTML =
                    "✅ تم قراءة QR<br><br>" +
                    "ID: " +
                    decodedText;


                scanner.stop();

                scanning = false;

            }

        );

        document.getElementById("result").innerHTML =
            "📷 وجّه الكاميرا إلى QR Code";

    }

    catch(error) {

        scanning = false;

        document.getElementById("result").innerHTML =
            "❌ خطأ في تشغيل الكاميرا<br><br>" +
            error;

        console.error(error);

    }

}

</script>

</body>

</html>
